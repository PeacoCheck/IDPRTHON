[project]
name = "id-vault"
version = "0.2.0"
description = "Локальное хранилище исполнительной документации"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.11,<3",
  "alembic>=1.16,<2",
  "docxtpl>=0.20,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5.8,<6",
  "python-multipart>=0.0.20,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
