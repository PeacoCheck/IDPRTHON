<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Исполнительная документация</title>
<style>
  /* =========================================================
     ТЕМА. Светлая и тёмная. Без внешних шрифтов и CDN —
     приложение работает локально и без интернета.
     ========================================================= */
  :root{
    --bg:#eef0f3; --panel:#f6f7f9; --card:#ffffff; --card2:#fafbfc;
    --text:#1d1d1f; --text2:#6b7280; --text3:#9aa1ac;
    --hair:rgba(0,0,0,.09); --hair2:rgba(0,0,0,.05);
    --accent:#2563eb; --accent-h:#1d4ed8; --accent-soft:rgba(37,99,235,.10);
    --green:#1d9a4a; --green-bg:rgba(34,197,94,.14);
    --red:#dc2626; --red-bg:rgba(239,68,68,.12);
    --amber:#b45309; --amber-bg:rgba(245,158,11,.16);
    --gray:#9aa1ac; --gray-bg:rgba(120,130,145,.14);
    --sel:rgba(37,99,235,.12);
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  }
  [data-theme="dark"]{
    --bg:#0e0f12; --panel:#16171b; --card:#1c1d22; --card2:#212329;
    --text:#f3f4f6; --text2:#9aa1ad; --text3:#6b7280;
    --hair:rgba(255,255,255,.10); --hair2:rgba(255,255,255,.06);
    --accent:#3b82f6; --accent-h:#60a5fa; --accent-soft:rgba(59,130,246,.16);
    --green:#34d36b; --green-bg:rgba(52,211,107,.16);
    --red:#f87171; --red-bg:rgba(248,113,113,.16);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,.16);
    --gray:#6b7280; --gray-bg:rgba(120,130,145,.18);
    --sel:rgba(59,130,246,.18);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:#fff}
  button{font:inherit; cursor:pointer}
  svg{display:block}

  /* =========================================================
     КАРКАС: верхняя панель + (сайдбар | рабочая область)
     ========================================================= */
  .app{display:grid; grid-template-rows:52px 1fr; height:100vh; overflow:hidden}

  /* ---------- верхняя панель ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--hair); z-index:30;
  }
  .app-title{display:flex; align-items:center; gap:9px; font-weight:650; font-size:14.5px; letter-spacing:-.01em; white-space:nowrap}
  .app-title .mark{width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--accent),#7c5cff); display:grid; place-items:center}
  .app-title .mark svg{width:13px; height:13px; color:#fff}

  /* выбор объекта */
  .obj-picker{position:relative}
  .obj-btn{
    display:flex; align-items:center; gap:8px; padding:6px 11px; border-radius:8px;
    border:1px solid var(--hair); background:var(--card); color:var(--text); font-size:13px; max-width:340px;
  }
  .obj-btn:hover{border-color:var(--accent); background:var(--card2)}
  .obj-btn .lab{color:var(--text2); font-size:12px}
  .obj-btn .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px}
  .obj-btn .cv{color:var(--text2); transition:transform .2s}
  .obj-picker.open .obj-btn .cv{transform:rotate(180deg)}
  .obj-menu{
    position:absolute; top:calc(100% + 6px); left:0; min-width:300px; z-index:40;
    background:var(--card); border:1px solid var(--hair); border-radius:10px; box-shadow:var(--shadow);
    padding:6px; display:none;
  }
  .obj-picker.open .obj-menu{display:block}
  .obj-item{padding:9px 10px; border-radius:7px; cursor:pointer}
  .obj-item:hover{background:var(--card2)}
  .obj-item.active{background:var(--sel)}
  .obj-item .t{font-weight:600; font-size:13px}
  .obj-item .a{font-size:11.5px; color:var(--text2); margin-top:1px}

  .topbar-spacer{flex:1}
  .tbtn{
    display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border-radius:8px;
    border:1px solid transparent; background:transparent; color:var(--text2); font-size:13px; white-space:nowrap;
  }
  .tbtn:hover{background:var(--card); color:var(--text); border-color:var(--hair)}
  .tbtn svg{width:15px; height:15px}
  .tbtn.icon-only{padding:7px}

  /* ---------- рабочая зона ---------- */
  .body{display:grid; grid-template-columns:272px 1fr; overflow:hidden}

  /* ---------- сайдбар ---------- */
  .sidebar{
    background:var(--panel); border-right:1px solid var(--hair);
    overflow-y:auto; padding:8px 8px 24px; user-select:none;
  }
  .sidebar::-webkit-scrollbar{width:9px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--hair); border-radius:6px}
  .nav-group{margin-bottom:2px}
  .nav-row{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px;
    cursor:pointer; position:relative; font-size:13px; color:var(--text);
  }
  .nav-row:hover{background:var(--card)}
  .nav-row.active{background:var(--sel); color:var(--accent); font-weight:600}
  .nav-row.active .n-ic{color:var(--accent)}
  .nav-row .twist{width:14px; height:14px; color:var(--text3); flex:0 0 auto; transition:transform .2s}
  .nav-group.open > .nav-row .twist{transform:rotate(90deg)}
  .nav-row .twist.empty{visibility:hidden}
  .n-ic{width:17px; height:17px; flex:0 0 auto; color:var(--text2)}
  .n-ic svg{width:17px; height:17px}
  .nav-row .label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .nav-row .count{
    font-size:11px; font-variant-numeric:tabular-nums; color:var(--text2);
    background:var(--card2); border:1px solid var(--hair); border-radius:980px; padding:0 6px; min-width:18px; text-align:center;
  }
  .nav-row.active .count{background:var(--card); border-color:transparent}
  .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .dot.ready{background:var(--green)} .dot.warn{background:var(--amber)}
  .dot.err{background:var(--red)} .dot.empty{background:var(--gray)}
  .nav-children{display:none; margin:1px 0 4px}
  .nav-group.open > .nav-children{display:block}
  .nav-children .nav-row{padding-left:30px}
  .nav-children .nav-children .nav-row{padding-left:46px}

  .side-add{
    margin:10px 4px 0; display:flex; align-items:center; gap:8px; justify-content:center;
    padding:9px; border:1px dashed var(--hair); border-radius:9px; color:var(--text2); font-size:12.5px; width:calc(100% - 8px);
    background:transparent;
  }
  .side-add:hover{border-color:var(--accent); color:var(--accent)}
  .side-add svg{width:14px; height:14px}

  /* ---------- центральная рабочая область ---------- */
  .main{display:flex; flex-direction:column; overflow:hidden}
  .crumbs{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:10px 22px; border-bottom:1px solid var(--hair); background:var(--card2);
    font-size:12.5px; color:var(--text2);
  }
  .crumbs a{color:var(--text2); cursor:pointer; text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .crumbs .sep{color:var(--text3)}
  .crumbs .cur{color:var(--text); font-weight:600}

  .content{flex:1; overflow-y:auto; padding:20px 22px 120px}
  .content::-webkit-scrollbar{width:10px}
  .content::-webkit-scrollbar-thumb{background:var(--hair); border-radius:6px}

  /* шапка раздела (спокойная, рабочая — без рекламных заголовков) */
  .sec-head{
    background:var(--card); border:1px solid var(--hair); border-radius:12px;
    padding:14px 18px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .sec-head h1{font-size:16px; font-weight:650; letter-spacing:-.01em; margin-bottom:10px}
  .meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:6px 22px}
  .meta-grid .mi{display:flex; gap:8px; font-size:12.5px; line-height:1.5}
  .meta-grid .mi .k{color:var(--text2); flex:0 0 auto; min-width:96px}
  .meta-grid .mi .val{color:var(--text); font-weight:500}

  /* подвкладки внутри раздела */
  .subtabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:16px; border-bottom:1px solid var(--hair)}
  .subtab{
    padding:8px 13px; border:0; background:transparent; color:var(--text2); font-size:13px;
    border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:6px 6px 0 0;
  }
  .subtab:hover{color:var(--text); background:var(--card2)}
  .subtab.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

  /* статистика раздела */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px}
  .stat{background:var(--card); border:1px solid var(--hair); border-radius:11px; padding:14px 16px; box-shadow:var(--shadow)}
  .stat .num{font-size:26px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .stat .lbl{font-size:12px; color:var(--text2); margin-top:2px}
  .stat.good .num{color:var(--green)} .stat.bad .num{color:var(--red)} .stat.warny .num{color:var(--amber)}

  .block-title{font-size:14px; font-weight:650; margin:4px 0 10px; display:flex; align-items:center; gap:8px}
  .block-title .count{font-size:12px; font-weight:600; color:var(--text2); background:var(--card); border:1px solid var(--hair); padding:1px 9px; border-radius:980px}

  .card{background:var(--card); border:1px solid var(--hair); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}

  /* проверка данных */
  .check-row{display:flex; gap:11px; padding:11px 16px; border-bottom:1px solid var(--hair2); font-size:13.5px; align-items:flex-start}
  .check-row:last-child{border-bottom:0}
  .check-ic{flex:0 0 auto; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; margin-top:1px}
  .check-ic svg{width:11px; height:11px}
  .check-row.err .check-ic{background:var(--red-bg); color:var(--red)}
  .check-row.warn .check-ic{background:var(--amber-bg); color:var(--amber)}
  .allgood{display:flex; align-items:center; gap:11px; padding:16px; font-size:14px; font-weight:500}

  /* комиссия */
  .people{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px}
  .person{background:var(--card); border:1px solid var(--hair); border-radius:11px; padding:14px; box-shadow:var(--shadow)}
  .person .role{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin-bottom:6px}
  .person .fio{font-size:14.5px; font-weight:600}
  .person .meta{font-size:12.5px; color:var(--text2); margin-top:3px; line-height:1.5}

  /* таблица реестра АОСР */
  .reg{width:100%; border-collapse:collapse; font-size:13px}
  .reg thead th{
    text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text2); padding:10px 12px; border-bottom:1px solid var(--hair); white-space:nowrap; background:var(--card2);
  }
  .reg tbody tr.row{border-bottom:1px solid var(--hair2)}
  .reg tbody tr.row:last-child{border-bottom:0}
  .reg td{padding:11px 12px; vertical-align:top}
  .reg tr.row:hover{background:var(--card2)}
  .reg tr.row.sel{background:var(--sel)}
  .col-tick{width:34px}
  .col-no{width:60px; font-weight:700; font-variant-numeric:tabular-nums}
  .col-date,.col-period{white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--text2)}
  .col-works .w{font-weight:500; line-height:1.35; max-width:340px}
  .col-mat{color:var(--text2); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .col-status{white-space:nowrap}
  .col-act{width:64px; text-align:right}
  .tick{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--hair);
    display:grid; place-items:center; background:transparent;
  }
  .tick svg{width:12px; height:12px; color:#fff; opacity:0; transform:scale(.5); transition:all .15s}
  tr.row.sel .tick{background:var(--accent); border-color:var(--accent)}
  tr.row.sel .tick svg{opacity:1; transform:scale(1)}
  .badge{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:980px; white-space:nowrap}
  .badge.ok{color:var(--green); background:var(--green-bg)}
  .badge.err{color:var(--red); background:var(--red-bg)}
  .badge.warn{color:var(--amber); background:var(--amber-bg)}
  .link-btn{border:0; background:transparent; color:var(--accent); font-size:12.5px; padding:4px 6px; border-radius:6px}
  .link-btn:hover{background:var(--accent-soft)}
  /* раскрытие строки акта */
  tr.detail > td{padding:0; background:var(--card2)}
  .detail-inner{display:none; padding:2px 0}
  tr.detail.open .detail-inner{display:block}
  .act-issues{padding:8px 16px}
  .act-issues .it{font-size:12.5px; padding:3px 0; display:flex; gap:8px; align-items:baseline}
  .act-issues .it::before{content:"●"; font-size:7px; position:relative; top:-2px}
  .act-issues .it.e{color:var(--red)} .act-issues .it.e::before{color:var(--red)}
  .act-issues .it.w{color:var(--amber)} .act-issues .it.w::before{color:var(--amber)}
  .act-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hair); border-top:1px solid var(--hair)}
  .fld{background:var(--card2); padding:10px 16px}
  .fld.full{grid-column:1 / -1}
  .fld .k{font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text2)}
  .fld .v{font-size:13px; margin-top:3px; line-height:1.45; word-wrap:break-word}
  .fld .v.dash::before{content:"—"; color:var(--text3)}

  /* настройки раздела (read-only) */
  .kv{display:grid; grid-template-columns:1fr; gap:1px; background:var(--hair); border-radius:12px; overflow:hidden; border:1px solid var(--hair)}
  .kv .row{display:flex; gap:14px; background:var(--card); padding:12px 16px; font-size:13px}
  .kv .row .k{color:var(--text2); min-width:220px; flex:0 0 auto}
  .kv .row .v{font-weight:500; word-break:break-all}

  /* placeholder для нереализованных разделов */
  .placeholder{
    background:var(--card); border:1px solid var(--hair); border-radius:14px; box-shadow:var(--shadow);
    padding:38px 32px; text-align:center; max-width:560px; margin:24px auto;
  }
  .placeholder .pic{width:54px; height:54px; border-radius:14px; background:var(--gray-bg); color:var(--text2); display:grid; place-items:center; margin:0 auto 16px}
  .placeholder .pic svg{width:26px; height:26px}
  .placeholder h2{font-size:18px; font-weight:650}
  .placeholder p{font-size:13.5px; color:var(--text2); margin-top:8px; line-height:1.55}
  .placeholder .acts{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:20px}

  /* фатальная ошибка чтения данных */
  .fatal-card{padding:34px 28px; text-align:center}
  .fatal-card h3{font-size:17px; font-weight:650; margin-top:12px}
  .fatal-card p{font-size:13.5px; color:var(--text2); margin-top:8px; line-height:1.5; white-space:pre-line}
  .seal{width:60px; height:60px; margin:0 auto; border-radius:50%; display:grid; place-items:center}
  .seal.good{background:var(--green-bg)} .seal.bad{background:var(--red-bg)}
  .seal svg{width:30px; height:30px}

  /* ---------- кнопки ---------- */
  .btn{border:0; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; transition:background .15s, transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent); color:#fff; font-size:14px; font-weight:550; padding:10px 20px}
  .btn-primary:hover{background:var(--accent-h)}
  .btn-primary:disabled{opacity:.5; cursor:default; transform:none}
  .btn-secondary{background:var(--card); border:1px solid var(--hair); color:var(--text); font-size:13.5px; padding:9px 16px}
  .btn-secondary:hover{background:var(--card2)}
  .btn-ghost{background:transparent; color:var(--accent); font-size:13.5px; padding:8px 12px}
  .btn-ghost:hover{background:var(--accent-soft)}
  .spinner{width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- нижняя панель (массовые действия) ---------- */
  .dock{
    position:absolute; left:272px; right:0; bottom:0; z-index:25;
    background:var(--panel); border-top:1px solid var(--hair);
    transform:translateY(110%); transition:transform .3s ease;
  }
  .dock.show{transform:translateY(0)}
  .dock-inner{padding:11px 22px; display:flex; align-items:center; gap:14px}
  .dock-info{font-size:13px; color:var(--text2)}
  .dock-info b{color:var(--text); font-weight:600}
  .dock-spacer{flex:1}

  /* ---------- модальное окно ---------- */
  .overlay{
    position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:20px;
    background:rgba(0,0,0,.42); opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.show{opacity:1; pointer-events:auto}
  .sheet{
    width:min(540px,100%); max-height:86vh; overflow:auto;
    background:var(--card); border:1px solid var(--hair); border-radius:16px; box-shadow:var(--shadow);
    padding:28px 26px 22px; transform:translateY(10px) scale(.98); transition:transform .25s;
  }
  .overlay.show .sheet{transform:none}
  .sheet h2{font-size:20px; font-weight:700; text-align:center}
  .sheet .sub{font-size:13.5px; color:var(--text2); text-align:center; margin-top:6px; line-height:1.5; white-space:pre-line}
  .files{margin-top:18px; border:1px solid var(--hair); border-radius:10px; overflow:hidden}
  .file-row{display:flex; align-items:center; gap:11px; padding:10px 13px; border-bottom:1px solid var(--hair2); font-size:13px}
  .file-row:last-child{border-bottom:0}
  .file-row .fi{flex:0 0 auto; color:var(--accent)} .file-row .fi svg{width:16px; height:16px}
  .file-row .fn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sheet-actions{display:flex; gap:9px; justify-content:center; margin-top:20px; flex-wrap:wrap}
  /* форма «Добавить раздел» */
  .form-field{margin-top:14px}
  .form-field label{display:block; font-size:12.5px; font-weight:600; color:var(--text2); margin-bottom:5px}
  .form-field input, .form-field select, .form-field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--hair); border-radius:9px;
    background:var(--card2); color:var(--text); font:inherit; font-size:13.5px;
  }
  .form-field textarea{min-height:92px; resize:vertical}
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:0; border-color:var(--accent)}

  .object-grid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr); gap:16px}
  .object-card{background:var(--card); border:1px solid var(--hair); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
  .object-card .pad{padding:16px}
  .object-title{font-size:17px; font-weight:650; line-height:1.25; margin-bottom:5px}
  .object-address{font-size:13.5px; color:var(--text2); line-height:1.5}
  .object-actions{display:flex; gap:9px; flex-wrap:wrap; padding:14px 16px; border-top:1px solid var(--hair2); background:var(--card2)}
  .object-sections{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:16px}
  .section-tile{border:1px solid var(--hair); background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:15px; text-align:left}
  .section-tile:hover{border-color:var(--accent); background:var(--card2)}
  .section-tile .ic{width:32px; height:32px; border-radius:9px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); margin-bottom:10px}
  .section-tile .ic svg{width:18px; height:18px}
  .section-tile .ttl{font-weight:650}
  .section-tile .sub{font-size:12.5px; color:var(--text2); margin-top:3px}
  .empty-state{background:var(--card); border:1px dashed var(--hair); border-radius:14px; padding:30px; text-align:center}
  .empty-state h2{font-size:18px; margin-bottom:8px}
  .empty-state p{color:var(--text2); margin-bottom:16px}
  .archive-list{display:grid; gap:12px}
  .archive-item{background:var(--card); border:1px solid var(--hair); border-radius:12px; box-shadow:var(--shadow); padding:15px}
  .archive-item .name{font-weight:650; margin-bottom:4px}

<script>
"use strict";

/* =========================================================
   ГЛОБАЛЬНОЕ СОСТОЯНИЕ
   ========================================================= */
let APP = null;                 // ответ /api/app-state (объекты + раздел АОСР)
let STATE = null;               // состояние раздела АОСР (APP.aosr)
let ACTIVE_OBJECT_ID = "";
let ACTIVE_SECTION = localStorage.getItem("id-section") || "objects/current";
let AOSR_TAB = "check";         // активная подвкладка внутри АОСР
let SELECTED = new Set();       // выбранные акты (по номеру)
let BUSY = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* =========================================================
   ИКОНКИ (инлайн SVG, без внешних библиотек)
   ========================================================= */
const ICON = {
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 4v13"/></svg>',
  fileCheck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>',
  boxes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5z"/><path d="M3 9v6l9 5 9-5V9"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  schema:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6h6a2 2 0 0 1 2 2v6"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 12v5M12 9v8M16 13v4"/></svg>',
  page:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
};

/* =========================================================
   МЕНЮ РАЗДЕЛОВ.
   Структура UI — её легко расширять, добавляя новые узлы.
   id      — путь раздела (используется в ACTIVE_SECTION и крошках)
   status  — ready | warn | err | empty (цвет точки)
   count   — счётчик документов (необязателен)
   children — вложенные пункты
   ========================================================= */
const MENU = [
  { id:"objects", title:"Объекты", icon:"folder", children:[
    { id:"objects/current", title:"Текущий объект" },
    { id:"objects/add",     title:"Добавить объект" },
    { id:"objects/archive", title:"Архив объектов" },
  ]},
  { id:"journals", title:"Журналы", icon:"book", children:[
    { id:"journals/general",  title:"Общий журнал работ" },
    { id:"journals/welding",  title:"Журнал сварочных работ" },
    { id:"journals/incoming", title:"Журнал входного контроля" },
    { id:"journals/concrete", title:"Журнал бетонных работ" },
    { id:"journals/author",   title:"Журнал авторского надзора" },
    { id:"journals/briefing", title:"Журнал инструктажей" },
    { id:"journals/foreman",  title:"Прорабские журналы", children:[
      { id:"journals/foreman/daily",  title:"Ежедневный отчёт" },
      { id:"journals/foreman/works",  title:"Работы за день" },
      { id:"journals/foreman/people", title:"Люди / техника" },
      { id:"journals/foreman/notes",  title:"Замечания" },
    ]},
  ]},
  { id:"acts", title:"Акты", icon:"fileCheck", children:[
    { id:"acts/aosr",      title:"АОСР", status:"ready", current:true },
    { id:"acts/vik",       title:"Акт ВИК" },
    { id:"acts/hydro",     title:"Акт гидравлического испытания" },
    { id:"acts/flush",     title:"Акт промывки" },
    { id:"acts/pressure",  title:"Акт опрессовки" },
    { id:"acts/struct",    title:"Акт приёмки ответственных конструкций" },
    { id:"acts/networks",  title:"Акт освидетельствования участков сетей" },
    { id:"acts/front",     title:"Акт передачи фронта работ" },
    { id:"acts/other",     title:"Прочие акты" },
  ]},
  { id:"materials", title:"Документы по материалам", icon:"boxes", children:[
    { id:"materials/registry",     title:"Реестр материалов" },
    { id:"materials/certificates", title:"Сертификаты качества" },
    { id:"materials/passports",    title:"Паспорта" },
    { id:"materials/declarations", title:"Декларации" },
    { id:"materials/tests",        title:"Протоколы испытаний" },
    { id:"materials/incoming",     title:"Входной контроль" },
    { id:"materials/missing",      title:"Заявка недостающих документов" },
  ]},
  { id:"permits", title:"Разрешительная документация", icon:"shield", children:[
    { id:"permits/orders",    title:"Приказы" },
    { id:"permits/sro",       title:"Допуски СРО" },
    { id:"permits/nrs",       title:"НРС" },
    { id:"permits/poa",       title:"Доверенности" },
    { id:"permits/project",   title:"Проектная документация" },
    { id:"permits/working",   title:"Рабочая документация" },
    { id:"permits/ppr",       title:"ППР" },
    { id:"permits/techcards", title:"Технологические карты" },
    { id:"permits/permissions", title:"Разрешения / уведомления" },
  ]},
  { id:"schemes", title:"Исполнительные схемы", icon:"schema", children:[
    { id:"schemes/registry",     title:"Реестр схем" },
    { id:"schemes/bysection",    title:"Схемы по разделам" },
    { id:"schemes/upload",       title:"Загрузка схем" },
    { id:"schemes/completeness", title:"Проверка комплектности" },
  ]},
  { id:"reports", title:"Отчёты", icon:"report", children:[
    { id:"reports/completeness", title:"Комплектность ИД" },
    { id:"reports/errors",       title:"Ошибки и предупреждения" },
    { id:"reports/missing",      title:"Что не хватает" },
    { id:"reports/export",       title:"Выгрузка реестра" },
  ]},
];

/* пользовательские разделы из localStorage (кнопка «+ Добавить раздел») */
function customSections(){
  try{ return JSON.parse(localStorage.getItem("id-custom-sections") || "[]"); }
  catch(e){ return []; }
}
/* вернуть рабочее меню = MENU + пользовательские разделы, привитые к родителю */
function getMenu(){
  const menu = JSON.parse(JSON.stringify(MENU));   // глубокая копия, чтобы не мутировать оригинал
  for(const cs of customSections()){
    const parent = menu.find(g => g.id === cs.parent);
    const node = { id:cs.id, title:cs.title, status:"empty", custom:true };
    if(parent){ (parent.children = parent.children || []).push(node); }
    else menu.push({ id:cs.id, title:cs.title, icon:"folder", children:[], custom:true });
  }
  return menu;
}

/* =========================================================
   ОБХОД МЕНЮ: найти узел и путь (для крошек и заголовка)
   ========================================================= */
function findPath(menu, id, trail){
  trail = trail || [];
  for(const node of menu){
    const here = trail.concat(node);
    if(node.id === id) return here;
    if(node.children){
      const r = findPath(node.children, id, here);
      if(r) return r;
    }
  }
  return null;
}

/* =========================================================
   ТЕМА
   ========================================================= */
function applyTheme(mode){
  document.documentElement.dataset.theme = mode;
  localStorage.setItem("id-theme", mode);
  $("themeIcon").innerHTML = mode === "dark"
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" stroke-linejoin="round"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); }
applyTheme(localStorage.getItem("id-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* =========================================================
   ТОСТ
   ========================================================= */
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

async function postJson(url, body){
  const r = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(body || {})
  });
  const data = await r.json();
  if(!r.ok || data.ok === false){
    throw new Error(data.error || (data.fatal && data.fatal.msg) || "Операция не выполнена");
  }
  return data;
}

function applyAppState(next){
  APP = next;
  STATE = APP.aosr || { ok:false };
  ACTIVE_OBJECT_ID = APP.activeObjectId || "";
  SELECTED.clear();
  renderObjectPicker();
  renderShell();
}

function currentObject(){
  return (APP && APP.currentObject) || null;
}

function activeObject(){
  const objs = (APP && APP.objects) || [];
  return currentObject() || objs.find(o => o.id === ACTIVE_OBJECT_ID) || objs[0] || null;
}

/* =========================================================
   ЗАГРУЗКА СОСТОЯНИЯ ПРИЛОЖЕНИЯ
   ========================================================= */
async function loadState(manual){
  try{
    const r = await fetch("/api/app-state");
    APP = await r.json();
  }catch(e){
    APP = { ok:false, objects:[], aosr:{ ok:false, fatal:{ msg:"Сервер не отвечает.", hint:"запустите ЗАПУСК.bat заново." } } };
  }
  STATE = APP.aosr || { ok:false };
  if(APP.activeObjectId) ACTIVE_OBJECT_ID = APP.activeObjectId;
  if(!ACTIVE_SECTION) ACTIVE_SECTION = APP.activeSection || "objects/current";
  SELECTED.clear();
  renderObjectPicker();
  renderShell();
  if(manual) toast("Данные обновлены из Excel");
}

/* =========================================================
   ВЫПАДАЮЩИЙ СПИСОК ОБЪЕКТОВ
   ========================================================= */
function renderObjectPicker(){
  const objs = (APP && APP.objects) || [];
  const active = (APP && APP.currentObject) || objs.find(o => o.id === ACTIVE_OBJECT_ID) || objs[0];
  $("objBtnName").textContent = active ? active.shortName : "Объект не выбран";
  $("objMenu").innerHTML = objs.length
    ? objs.map(o => `
        <div class="obj-item ${o.id===ACTIVE_OBJECT_ID?"active":""}" onclick="selectObject('${esc(o.id)}')">
          <div class="t">${esc(o.shortName)}</div>
          <div class="a">${esc(o.address || "адрес не указан")}</div>
        </div>`).join("")
    : `<div class="obj-item" onclick="gotoSection('objects/add')"><div class="t">Добавить объект</div><div class="a">База объектов пока пустая</div></div>`;
}
function toggleObjMenu(ev){
  ev.stopPropagation();
  $("objPicker").classList.toggle("open");
}
async function selectObject(id){
  $("objPicker").classList.remove("open");
  if(id === ACTIVE_OBJECT_ID) return;
  if(!confirm("Переключить текущий объект? Данные разделов будут загружены из Excel выбранного объекта.")) return;
  try{
    const next = await postJson("/api/object/select", { id });
    applyAppState(next);
    toast("Текущий объект изменён");
  }catch(e){
    toast(e.message || "Не удалось переключить объект");
  }
}
document.addEventListener("click", () => $("objPicker").classList.remove("open"));

/* =========================================================
   КАРКАС: сайдбар + крошки + раздел
   ========================================================= */
function renderShell(){
  renderSidebar();
  renderBreadcrumbs();
  renderSection();
}

/* ---------- статус/счётчик пункта меню ---------- */
function nodeStatus(node){
  // АОСР берёт статус из реальных данных
  if(node.id === "acts/aosr" && STATE){
    if(!STATE.ok) return { dot:"err", count:null };
    if(STATE.errors)   return { dot:"err",   count:STATE.acts.length };
    if(STATE.warnings) return { dot:"warn",  count:STATE.acts.length };
    return { dot:"ready", count:STATE.acts.length };
  }
  const map = { ready:"ready", warn:"warn", err:"err" };
  return { dot: map[node.status] || "empty", count: node.count ?? null };
}

/* ---------- сайдбар (дерево разделов) ---------- */
function renderSidebar(){
  const menu = getMenu();
  $("sidebar").innerHTML = menu.map(g => renderNavGroup(g)).join("")
    + `<button class="side-add" onclick="openAddSection()">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
         Добавить раздел
       </button>`;
}
function isAncestorActive(node){
  if(node.id === ACTIVE_SECTION) return true;
  if(node.children) return node.children.some(isAncestorActive);
  return false;
}
function renderNavGroup(node, depth){
  depth = depth || 0;
  const hasKids = node.children && node.children.length;
  const st = nodeStatus(node);
  const active = node.id === ACTIVE_SECTION;
  const open = hasKids && isAncestorActive(node);
  const ico = depth === 0 && node.icon ? `<span class="n-ic">${ICON[node.icon] || ICON.folder}</span>` : "";
  const twist = hasKids
    ? `<svg class="twist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`
    : `<svg class="twist empty" viewBox="0 0 24 24"></svg>`;
  const right = st.count != null
    ? `<span class="count">${st.count}</span>`
    : `<span class="dot ${st.dot}"></span>`;

  let html = `<div class="nav-group ${open?"open":""}">
    <div class="nav-row ${active?"active":""}" onclick="onNavClick(event,'${esc(node.id)}',${!!hasKids})">
      ${twist}${ico}<span class="label">${esc(node.title)}</span>${right}
    </div>`;
  if(hasKids){
    html += `<div class="nav-children">${node.children.map(c => renderNavGroup(c, depth+1)).join("")}</div>`;
  }
  html += `</div>`;
  return html;
}
function onNavClick(ev, id, hasKids){
  ev.stopPropagation();
  if(hasKids){
    // родительский пункт: раскрыть/свернуть + сделать активным первый лист по клику
    const grp = ev.currentTarget.closest(".nav-group");
    grp.classList.toggle("open");
    return;
  }
  ACTIVE_SECTION = id;
  localStorage.setItem("id-section", id);
  AOSR_TAB = "check";
  SELECTED.clear();
  renderShell();
}

/* ---------- хлебные крошки ---------- */
function renderBreadcrumbs(){
  const obj = activeObject();
  const path = findPath(getMenu(), ACTIVE_SECTION) || [];
  let html = `<a onclick="gotoSection('objects/current')">Объекты</a>`;
  if(obj){
    html += `<span class="sep">/</span><a onclick="gotoSection('acts/aosr')">${esc(obj.shortName)}</a>`;
  }
  path.forEach((n, i) => {
    html += `<span class="sep">/</span>`;
    if(i === path.length - 1) html += `<span class="cur">${esc(n.title)}</span>`;
    else html += `<a onclick="gotoSection('${esc(n.id)}')">${esc(n.title)}</a>`;
  });
  $("crumbs").innerHTML = html;
}
function gotoSection(id){
  // переход по крошке/ссылке: если у узла есть только дети — берём первый лист
  const node = findPath(getMenu(), id);
  ACTIVE_SECTION = id;
  localStorage.setItem("id-section", id);
  AOSR_TAB = "check"; SELECTED.clear();
  renderShell();
}

/* =========================================================
   РОУТЕР РАЗДЕЛОВ
   ========================================================= */
function renderSection(){
  if(ACTIVE_SECTION === "objects/current"){
    renderCurrentObjectSection();

    renderAosrSection();
  }else{
    renderPlaceholder();
    $("dock").classList.remove("show");
  }
}

function renderAosrSection(){
  const c = $("content");

  /* фатальная ошибка чтения данных */
  if(!STATE || !STATE.ok){
    c.innerHTML = sectionHeadHtml(path) + `
      <div class="card"><div class="fatal-card">
        <div class="seal bad"><svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        <h3>${esc(STATE && STATE.fatal ? STATE.fatal.msg : "Не удалось прочитать данные")}</h3>
        <p>${esc(STATE && STATE.fatal && STATE.fatal.hint ? "Подсказка: " + STATE.fatal.hint : "")}</p>
        <div class="sheet-actions"><button class="btn btn-primary" onclick="loadState(true)">Попробовать снова</button></div>
      </div></div>`;
    $("dock").classList.remove("show");
    return;
  }

  /* подвкладки раздела */
  const tabs = [
    { id:"check",     title:"Проверка данных" },
    { id:"registry",  title:"Реестр АОСР" },
    { id:"materials", title:"Материалы" },
    { id:"people",    title:"Комиссия" },
    { id:"settings",  title:"Настройки раздела" },
  ];
  const subtabs = `<div class="subtabs">${tabs.map(t =>
    `<button class="subtab ${AOSR_TAB===t.id?"active":""}" onclick="setAosrTab('${t.id}')">${t.title}</button>`).join("")}</div>`;

  let html = sectionHeadHtml(path);

  /* статистика — спокойный рабочий блок, без рекламы */
  const stats = `<div class="stats">
    <div class="stat"><div class="num">${STATE.acts.length}</div><div class="lbl">актов в реестре</div></div>
    <div class="stat"><div class="num">${STATE.people.length}</div><div class="lbl">участников комиссии</div></div>
    <div class="stat"><div class="num">${STATE.materials.length}</div><div class="lbl">материалов</div></div>
    <div class="stat ${STATE.errors?"bad":(STATE.warnings?"warny":"good")}">
      <div class="num">${STATE.errors ? STATE.errors : (STATE.warnings ? STATE.warnings : "✓")}</div>
      <div class="lbl">${STATE.errors ? "критических ошибок" : (STATE.warnings ? "предупреждений" : "проверки пройдены")}</div>
    </div>
  </div>`;

  html += stats + subtabs + `<div id="aosrPanel">${renderAosrPanel()}</div>`;
  c.innerHTML = html;

  /* нижняя панель массовых действий нужна на вкладке реестра */
  updateDock();
  $("dock").classList.toggle("show", AOSR_TAB === "registry");
}

function setAosrTab(tab){
  AOSR_TAB = tab;
  $("aosrPanel").innerHTML = renderAosrPanel();
  // обновить активную подвкладку
  document.querySelectorAll(".subtab").forEach((b,i) => {
    b.classList.toggle("active", ["check","registry","materials","people","settings"][i] === tab);
  });
  $("dock").classList.toggle("show", tab === "registry");
  if(tab === "registry") syncRowSelection();
  updateDock();
}

/* содержимое активной подвкладки АОСР */

  if(AOSR_TAB === "check")     return panelCheck();
  if(AOSR_TAB === "registry")  return panelRegistry();
  if(AOSR_TAB === "materials") return panelMaterials();
  if(AOSR_TAB === "people")    return panelPeople();
  if(AOSR_TAB === "settings")  return panelSettings();
  return "";
}

function panelCheck(){
  const evs = (STATE.events || []).filter(e => e.level !== "ok");
  let inner = "";
  if(!evs.length){
    inner = `<div class="allgood">
      <div class="check-ic" style="background:var(--green-bg);color:var(--green)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 7"/></svg>
      </div>Все проверки пройдены — данные готовы к формированию документов.</div>`;

    for(const e of evs){
      const ic = e.level === "err"
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v8m0 4.5v.5"/></svg>';

    }

  return `<div class="block-title">Проверка данных</div><div class="card">${inner}</div>`;
}

/* =========================================================
   ВЫБОР АКТОВ И РАСКРЫТИЕ СТРОК
   ========================================================= */
function onTick(ev, num){
  ev.stopPropagation();
  if(SELECTED.has(num)) SELECTED.delete(num); else SELECTED.add(num);
  syncRowSelection();
  updateDock();
}
function syncRowSelection(){
  document.querySelectorAll(".reg tr.row").forEach(tr =>
    tr.classList.toggle("sel", SELECTED.has(tr.dataset.num)));
}
function toggleDetail(ev, num){
  ev.stopPropagation();
  const tr = document.querySelector(`.reg tr.detail[data-detail="${CSS.escape(num)}"]`);
  if(tr) tr.classList.toggle("open");
}
function toggleSelectAll(){
  const all = STATE.acts.map(a => a.num);
  const everything = all.length && all.every(n => SELECTED.has(n));
  SELECTED = everything ? new Set() : new Set(all);
  syncRowSelection();
  updateDock();
}
function updateDock(){
  const k = SELECTED.size, n = (STATE && STATE.acts ? STATE.acts.length : 0);
  $("dockInfo").innerHTML = k
    ? `Выбрано документов: <b>${k}</b> из ${n}`
    : `В реестре <b>${n}</b> ${plural(n, "акт", "акта", "актов")} — будут сформированы все`;
  $("genBtn").textContent = k ? `Сформировать выбранные (${k})` : `Сформировать все (${n})`;
  $("selAllBtn").textContent = (k === n && n > 0) ? "Снять выбор" : "Выбрать все";
  $("genBtn").disabled = BUSY || (STATE && STATE.errors > 0 && !k);
}
function plural(n, a, b, c){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return a;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b;
  return c;
}

/* =========================================================
   ГЕНЕРАЦИЯ ДОКУМЕНТОВ
   ========================================================= */
async function generate(){
  if(BUSY) return;
  BUSY = true;
  const btn = $("genBtn");
  const old = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> Формирование…';
  btn.disabled = true;
  try{
    const body = SELECTED.size ? { nums:[...SELECTED] } : { nums:null };
    const r = await fetch("/api/generate", {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body)
    });
    const res = await r.json();
    if(res.ok) showSuccess(res);
    else showFail(res.fatal || { msg:"Не удалось создать файлы." });
  }catch(e){
    showFail({ msg:"Сервер не отвечает.", hint:"запустите ЗАПУСК.bat заново." });
  }finally{
    BUSY = false; btn.textContent = old; updateDock();
  }
}

function showSuccess(res){
  const n = res.made.length;
  $("sheet").innerHTML = `
    <div class="seal good"><svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 7"/></svg></div>
    <h2>Документы сформированы</h2>
    <div class="sub">${n} ${plural(n,"документ создан","документа создано","документов создано")} в папке<br>${esc(res.out_dir)}</div>
    <div class="files">
      ${res.made.map(f => `
        <div class="file-row">
          <div class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
          <div class="fn" title="${esc(f.file)}">${esc(f.file)}</div>
          <button class="btn btn-ghost" onclick="openTarget('${esc(f.path).replace(/\\/g,"\\\\")}')">Открыть</button>
        </div>`).join("")}
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="hideOverlay()">Закрыть</button>
      <button class="btn btn-primary" onclick="openTarget('')">Открыть папку раздела</button>
    </div>`;
  $("overlay").classList.add("show");
}

function showFail(f){
  $("sheet").innerHTML = `
    <div class="seal bad"><svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    <h2>Файлы не созданы</h2>
    <div class="sub">${esc(f.msg)}${f.hint ? "\n\nПодсказка: " + esc(f.hint) : ""}</div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="hideOverlay()">Закрыть</button>
      <button class="btn btn-primary" onclick="hideOverlay(); loadState(true)">Обновить данные</button>
    </div>`;
  $("overlay").classList.add("show");
}

/* =========================================================
   ДОБАВЛЕНИЕ РАЗДЕЛА (UX-заглушка, хранение в localStorage)
   ========================================================= */
function openAddSection(){
  const groups = MENU.map(g => `<option value="${esc(g.id)}">${esc(g.title)}</option>`).join("");
  $("sheet").innerHTML = `
    <h2>Добавить раздел</h2>
    <div class="sub">Новый раздел появится в левом меню. Хранится локально на этом компьютере.</div>
    <div class="form-field"><label>Название раздела</label><input id="asName" placeholder="Например: Журнал монтажа"></div>
    <div class="form-field"><label>Родительский раздел</label><select id="asParent">${groups}</select></div>
    <div class="form-field"><label>Тип</label>
      <select id="asType">
        <option value="journal">Журнал</option>
        <option value="act">Акт</option>
        <option value="materials">Материалы</option>
        <option value="permits">Разрешительная</option>
        <option value="other">Другое</option>
      </select>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="hideOverlay()">Отмена</button>
      <button class="btn btn-primary" onclick="addSection()">Добавить</button>
    </div>`;
  $("overlay").classList.add("show");
}
function addSection(){
  const name = $("asName").value.trim();
  if(!name){ toast("Введите название раздела"); return; }
  const parent = $("asParent").value;
  const type = $("asType").value;
  const id = parent + "/custom-" + Date.now();
  const list = customSections();
  list.push({ id, parent, title:name, type });
  localStorage.setItem("id-custom-sections", JSON.stringify(list));
  hideOverlay();
  renderSidebar();
  toast("Раздел добавлен");
}

/* =========================================================
   ОБЪЕКТЫ: ДОБАВЛЕНИЕ, АРХИВ И ЛОКАЛЬНЫЕ ПАПКИ
   ========================================================= */
async function addObjectFromForm(){
  const name = $("newObjName").value.trim();
  const address = $("newObjAddress").value.trim();
  const comment = $("newObjComment").value.trim();
  if(!name){ toast("Введите наименование объекта"); return; }
  if(!confirm("Добавить объект и сделать его текущим?")) return;
  try{
    const next = await postJson("/api/object/add", { name, address, comment });
    ACTIVE_SECTION = "objects/current";
    localStorage.setItem("id-section", ACTIVE_SECTION);
    applyAppState(next);
    toast("Объект добавлен");
  }catch(e){
    toast(e.message || "Не удалось добавить объект");
  }
}

async function archiveCurrentObject(){
  const obj = currentObject();
  if(!obj) return;
  if(!confirm(`Архивировать объект «${obj.shortName || obj.name}»? Он исчезнет из активного списка.`)) return;
  try{
    const next = await postJson("/api/object/archive", { id:obj.id });
    ACTIVE_SECTION = "objects/current";
    localStorage.setItem("id-section", ACTIVE_SECTION);
    applyAppState(next);
    toast("Объект архивирован");
  }catch(e){
    toast(e.message || "Не удалось архивировать объект");
  }
}

async function restoreObject(id){
  if(!confirm("Восстановить объект из архива?")) return;
  try{
    const next = await postJson("/api/object/unarchive", { id });
    applyAppState(next);
    toast("Объект восстановлен");
  }catch(e){
    toast(e.message || "Не удалось восстановить объект");
  }
}

async function openObjectFolder(id){
  const obj = [...((APP && APP.objects) || []), ...((APP && APP.archiveObjects) || [])].find(o => o.id === id);
  if(!obj) return;
  if(!confirm(`Открыть локальную папку объекта «${obj.shortName || obj.name}»?`)) return;
  try{
    await postJson("/api/open-object-folder", { id });
  }catch(e){
    toast(e.message || "Не удалось открыть папку объекта");
  }
}

function openCurrentObjectFolder(){
  const obj = currentObject();
  if(obj) openObjectFolder(obj.id);
}

function openCurrentObjectExcel(){
  const obj = currentObject();
  if(!obj) return;
  openTarget(obj.dataFile || "");
}

async function openSectionFolder(section, title){
  const obj = currentObject();
  if(!obj){ toast("Объект не выбран"); return; }
  if(!confirm(`Открыть локальную папку раздела «${title}» для объекта «${obj.shortName || obj.name}»?`)) return;
  try{
    await postJson("/api/open-section", { section });
  }catch(e){
    toast(e.message || "Не удалось открыть папку раздела");
  }
}

/* =========================================================
   ОБЩИЕ ДЕЙСТВИЯ
   ========================================================= */
function hideOverlay(){ $("overlay").classList.remove("show"); }
async function openTarget(path){
  const obj = currentObject();
  const label = path ? "локальный файл" : "папку готовых документов АОСР";
  if(!confirm(`Открыть ${label}${obj ? ` для объекта «${obj.shortName || obj.name}»` : ""}?`)) return;
  try{
    const r = await fetch("/api/open", {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ path })
    });
    const res = await r.json();
    if(!res.ok) toast(res.error === "Файл или папка не существует."
      ? "Папка появится после первого формирования" : ("Не удалось открыть: " + (res.error || "")));
  }catch(e){ toast("Сервер не отвечает"); }
}
document.addEventListener("keydown", e => { if(e.key === "Escape") hideOverlay(); });

/* старт */
loadState(false);
</script>
</body>
</html>
